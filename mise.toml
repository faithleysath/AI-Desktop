[tools]
bun = "1.4.0"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tasks.install]
run = "bun install --frozen-lockfile"

[tasks.dev]
run = "bun run dev"

[tasks.typecheck]
run = "bun run typecheck"

[tasks.lint]
run = "bun run lint"

[tasks.test]
run = "bun run test"

[tasks.build]
run = "bun run build"

[tasks.check]
depends = ["typecheck", "lint", "test", "build"]
