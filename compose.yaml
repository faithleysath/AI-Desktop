services:
  app:
    profiles: ["production"]
    build:
      context: .
    environment:
      DATABASE_URL: postgres://edudesk:edudesk@postgres:5432/edudesk
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_SECRET: compose-development-secret-change-in-production-123
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: edudesk-private
      S3_ACCESS_KEY_ID: edudesk
      S3_SECRET_ACCESS_KEY: edudesk-secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: edudesk
      POSTGRES_USER: edudesk
      POSTGRES_PASSWORD: edudesk
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edudesk -d edudesk"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: edudesk
      MINIO_ROOT_PASSWORD: edudesk-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 edudesk edudesk-secret &&
      mc mb --ignore-existing local/edudesk-private &&
      mc anonymous set none local/edudesk-private"

volumes:
  postgres-data:
  minio-data:
